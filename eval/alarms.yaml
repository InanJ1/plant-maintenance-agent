# Corvane evaluation set: 20 synthetic condition-monitoring alarms.
# expected.* is what the planner and technician agreed the job turned out to be
# (the "true" cause). Priorities follow config/priority_policy.yaml.
# expected.parts lists stocked SKUs the job needs ([] = none).
# Some cases are hard on purpose: one signal that fits two causes, a cause
# outside the catalog, a failed sensor, an asset with no catalog entries.

- alarm_id: ALM-2610-001
  asset_id: CNC-04
  parameter: spindle_vib_overall_mm_s
  value: 7.9
  threshold: 4.5
  severity: warning
  timestamp: "2026-10-05T06:40:00+00:00"
  related_readings: {spindle_bearing_temp_c: 68}
  expected: {failure_mode: CNC-SPBRG-WEAR, priority: high,
             parts: [[SP-BRG-0114, 1], [SP-SEAL-0207, 1]]}
  why: Vibration plus hot bearing on a VX-640. Vibration past trip makes it critical; B + critical = high.

- alarm_id: ALM-2610-002
  asset_id: CNC-02
  parameter: spindle_vib_overall_mm_s
  value: 5.2
  threshold: 4.5
  severity: warning
  timestamp: "2026-10-05T09:15:00+00:00"
  related_readings: {}
  expected: {failure_mode: CNC-SPIMB, priority: high, parts: []}
  why: Vibration only, bearing temperature normal. Technician swapped the toolholder and it cleared.

- alarm_id: ALM-2610-003
  asset_id: CNC-07
  parameter: spindle_vib_env_g
  value: 3.1
  threshold: 1.5
  severity: critical
  timestamp: "2026-10-06T02:10:00+00:00"
  related_readings: {}
  expected: {failure_mode: CNC-SPBRG-WEAR, priority: high,
             parts: [[SP-BRG-0116, 1], [SP-SEAL-0207, 1]]}
  why: Bearing-band envelope on an HX-500 is specific to bearing damage. MTY1 has no HX-500 bearing set in stock.

- alarm_id: ALM-2610-004
  asset_id: CNC-01
  parameter: spindle_bearing_temp_c
  value: 64
  threshold: 55
  severity: warning
  timestamp: "2026-10-06T11:30:00+00:00"
  related_readings: {spindle_lube_pressure_bar: 1.1}
  expected: {failure_mode: CNC-SPLUB, priority: high,
             parts: [[SP-FLT-0405, 1], [SP-LUB-0402, 1]]}
  why: Hot bearing with low lube pressure is lube starvation. A + warning = high.

- alarm_id: ALM-2610-005
  asset_id: CNC-05
  parameter: spindle_bearing_temp_c
  value: 58
  threshold: 55
  severity: warning
  timestamp: "2026-10-07T07:05:00+00:00"
  related_readings: {}
  expected: {failure_mode: CNC-SPLUB, priority: medium,
             parts: [[SP-FLT-0405, 1], [SP-LUB-0402, 1]]}
  why: Hot bearing alone. The cause was a clogged lube line filter; the lube pressure sensor on CNC-05 is not wired to the monitoring system.

- alarm_id: ALM-2610-006
  asset_id: CNC-03
  parameter: drawbar_clamp_force_kn
  value: 14.0
  threshold: 18
  severity: warning
  timestamp: "2026-10-07T13:50:00+00:00"
  related_readings: {}
  expected: {failure_mode: CNC-DBAR, priority: emergency, parts: [[SP-SPRG-0031, 1]]}
  why: 14 kN is below the 15 kN trip limit (tool pull-out risk), so critical; A + critical = emergency.

