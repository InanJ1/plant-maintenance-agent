# Corvane reliability catalog (synthetic). One entry per failure mode.
# Fields map 1:1 onto machina's FailureMode model, plus `applies_to_models`,
# which the data loader uses to fill Asset.failure_modes for each asset.
# `typical_indicators` are the parameter names Corvane's condition-monitoring
# system puts on alarms (see config/alarm_parameters.yaml).
# ISO 14224 Table B.15 codes: VIB vibration, OHE overheating, PLU plugged,
# PDE parameter deviation, ELU external leakage (utility medium), ELP external
# leakage (process medium), LOO low output, AIR abnormal instrument reading.

- code: CNC-SPBRG-WEAR
  name: Spindle bearing wear
  iso_14224_code: VIB
  mechanism: wear
  category: mechanical
  applies_to_models: [VX-640, HX-500]
  detection_methods: [vibration_analysis, temperature_monitoring]
  typical_indicators: [spindle_vib_overall_mm_s, spindle_vib_env_g, spindle_bearing_temp_c]
  recommended_actions: [replace_spindle_bearing_set, replace_labyrinth_seal, run_in_spindle]
  mtbf_hours: 18000

- code: CNC-SPIMB
  name: Spindle or toolholder imbalance
  iso_14224_code: VIB
  mechanism: imbalance
  category: mechanical
  applies_to_models: [VX-640, HX-500]
  detection_methods: [vibration_analysis]
  typical_indicators: [spindle_vib_overall_mm_s, spindle_vib_1x_mm_s]
  recommended_actions: [clean_spindle_taper, balance_or_replace_toolholder]
  mtbf_hours: 6000

- code: CNC-SPLUB
  name: Spindle lubrication starvation
  iso_14224_code: OHE
  mechanism: lubrication_failure
  category: mechanical
  applies_to_models: [VX-640, HX-500]
  detection_methods: [temperature_monitoring, pressure_monitoring]
  typical_indicators: [spindle_bearing_temp_c, spindle_lube_pressure_bar]
  recommended_actions: [replace_lube_cartridge, replace_lube_line_filter, bleed_oil_air_lines]
  mtbf_hours: 12000

- code: CNC-DBAR
  name: Drawbar clamping force low
  iso_14224_code: PDE
  mechanism: fatigue
  category: mechanical
  applies_to_models: [VX-640, HX-500]
  detection_methods: [clamp_force_gauge]
  typical_indicators: [drawbar_clamp_force_kn, tool_unclamp_time_s]
  recommended_actions: [replace_disc_spring_stack, verify_clamp_force]
  mtbf_hours: 20000

- code: CNC-COOL
  name: Coolant system clogged
  iso_14224_code: PLU
